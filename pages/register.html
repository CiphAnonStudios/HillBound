<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#111111">

    <meta
        name="description"
        content="Create your Hillbound account."
    >

    <title>Hillbound — Create Account</title>

    <link
        rel="icon"
        type="image/png"
        href="../assets/images/ui/favicon.png"
    >

    <!-- Global Styles -->
    <link rel="stylesheet" href="../css/global.css">

    <!-- Authentication Styles -->
    <link rel="stylesheet" href="../css/auth.css">

    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >
</head>

<body class="auth-page">

    <!-- ==========================================
         AUTHENTICATION CONTAINER
    =========================================== -->

    <main class="auth-container">

        <!-- Background -->
        <div class="auth-background"></div>

        <!-- Dark Overlay -->
        <div class="auth-overlay"></div>


        <!-- ======================================
             REGISTER CARD
        ======================================= -->

        <section class="auth-card">

            <!-- Logo -->
            <a
                href="../index.html"
                class="auth-logo-link"
                aria-label="Return to Hillbound home"
            >
                <img
                    src="../assets/images/ui/logo.png"
                    alt="Hillbound"
                    class="auth-logo"
                >
            </a>


            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Create your account and start your climb.
            </p>


            <!-- ==================================
                 REGISTER FORM
            =================================== -->

            <form
                id="register-form"
                class="auth-form"
                novalidate
            >

                <!-- Username -->
                <div class="form-group">

                    <label for="register-username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="register-username"
                        name="username"
                        placeholder="Choose a username"
                        autocomplete="username"
                        minlength="3"
                        maxlength="20"
                        required
                    >

                    <small class="input-hint">
                        3–20 characters
                    </small>

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="register-email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="register-email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="register-password">
                        Password
                    </label>

                    <div class="password-input-wrapper">

                        <input
                            type="password"
                            id="register-password"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            id="toggle-password"
                            class="password-toggle"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="register-confirm-password">
                        Confirm Password
                    </label>

                    <div class="password-input-wrapper">

                        <input
                            type="password"
                            id="register-confirm-password"
                            name="confirm-password"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            id="toggle-confirm-password"
                            class="password-toggle"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- Terms -->
                <div class="terms-row">

                    <label class="checkbox-label">

                        <input
                            type="checkbox"
                            id="accept-terms"
                            name="terms"
                            required
                        >

                        <span>
                            I agree to the
                            <a href="#" id="terms-link">
                                Terms of Service
                            </a>
                            and
                            <a href="#" id="privacy-link">
                                Privacy Policy
                            </a>.
                        </span>

                    </label>

                </div>


                <!-- Error Message -->
                <div
                    id="register-error"
                    class="auth-message auth-error"
                    role="alert"
                    aria-live="polite"
                    hidden
                ></div>


                <!-- Success Message -->
                <div
                    id="register-success"
                    class="auth-message auth-success"
                    role="status"
                    aria-live="polite"
                    hidden
                ></div>


                <!-- Register Button -->
                <button
                    type="submit"
                    id="register-button"
                    class="auth-button primary-button"
                >

                    <span class="button-text">
                        Create Account
                    </span>

                    <span
                        class="button-loading"
                        hidden
                    >
                        Creating Account...
                    </span>

                </button>

            </form>


            <!-- ==================================
                 LOGIN LINK
            =================================== -->

            <div class="auth-divider">
                <span>or</span>
            </div>

            <p class="auth-switch">

                Already have an account?

                <a href="login.html">
                    Log In
                </a>

            </p>


            <!-- Back to Home -->
            <a
                href="../index.html"
                class="back-home"
            >
                ← Back to Hillbound
            </a>

        </section>

    </main>


    <!-- ==========================================
         REGISTER SCRIPT
    =========================================== -->

    <script
        src="../js/auth/register.js"
        defer
    ></script>

</body>
</html>
